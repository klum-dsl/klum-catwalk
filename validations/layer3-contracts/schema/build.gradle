plugins {
    id 'com.blackbuild.klum-ast-schema' version "${klumAstVersion}"
}

klumSchema {
    groovyVersion = rootProject.layer3TestPair.groovyLine
}

dependencies {
    implementation project(':domain-api')

    testImplementation(testFixtures(project(':domain-api')))
}

configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    resolutionStrategy.force(
            rootProject.layer3TestPair.groovyCoordinate,
            rootProject.layer3TestPair.spockCoordinate
    )
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'catwalk.expectedGroovyVersion', rootProject.layer3TestPair.groovyVersion
    systemProperty 'catwalk.expectedSpockVersion', rootProject.layer3TestPair.spockVersion
}
