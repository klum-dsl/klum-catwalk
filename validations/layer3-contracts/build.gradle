import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import java.util.Locale
import java.util.zip.ZipFile

plugins {
    id 'base'
}

ext {
    // This is the sole Groovy/Spock selection for this Layer 3 project. Every
    // participating module consumes this value; no module declares a pair of
    // its own.
    layer3TestPair = [
            groovyLine      : providers.gradleProperty('groovyLine').get(),
            groovyVersion   : providers.gradleProperty('groovyVersion').get(),
            spockVersion    : providers.gradleProperty('spockVersion').get(),
            groovyCoordinate: "org.codehaus.groovy:groovy:${providers.gradleProperty('groovyVersion').get()}",
            spockCoordinate : "org.spockframework:spock-core:${providers.gradleProperty('spockVersion').get()}"
    ].asImmutable()
}

def effectiveSelection = [
        klumAstVersion: providers.gradleProperty('klumAstVersion').get(),
        groovyLine    : layer3TestPair.groovyLine,
        groovyVersion : layer3TestPair.groovyVersion,
        spockVersion  : layer3TestPair.spockVersion
]

def selectedCoordinate = { Project selectedProject, String configurationName, String group, String module ->
    def matches = selectedProject.configurations.named(configurationName).get()
            .incoming.resolutionResult.allComponents
            .findAll { component ->
                component.moduleVersion?.group == group && component.moduleVersion?.name == module
            }
            .collect { component ->
                "${component.moduleVersion.group}:${component.moduleVersion.name}:${component.moduleVersion.version}".toString()
            }
            .unique()
    if (matches.size() != 1) {
        throw new GradleException(
                "Expected exactly one ${group}:${module} in ${selectedProject.path}:${configurationName}, found ${matches}"
        )
    }
    matches[0]
}

def resolvedPair = { Project selectedProject, String configurationName ->
    [
            groovy: selectedCoordinate(selectedProject, configurationName, 'org.codehaus.groovy', 'groovy'),
            spock : selectedCoordinate(selectedProject, configurationName, 'org.spockframework', 'spock-core')
    ]
}

def requireSelectedPair = { String participant, Map resolved ->
    def selected = [groovy: layer3TestPair.groovyCoordinate, spock: layer3TestPair.spockCoordinate]
    if (resolved != selected) {
        throw new GradleException(
                "Layer 3 Groovy/Spock pair mismatch for ${participant}; selected ${selected}, resolved ${resolved}"
        )
    }
}

def requireSuccessfulTestCase = { File report, String className, String testName ->
    if (!report.isFile()) {
        throw new GradleException("Missing test report: ${report}")
    }
    def suite = new XmlSlurper().parse(report)
    def matches = suite.testcase.findAll {
        it.@name.text() == testName && it.@classname.text() == className
    }
    if (matches.size() != 1) {
        throw new GradleException("Expected one executed ${className}#${testName} case, found ${matches.size()}")
    }
    def testCase = matches[0]
    def unsuccessfulNodes = testCase.children().findAll {
        it.name() in ['failure', 'error', 'skipped']
    }
    if (!unsuccessfulNodes.isEmpty()) {
        throw new GradleException("Test case did not pass: ${className}#${testName}")
    }
    def suiteCounts = ['failures', 'errors', 'skipped'].collectEntries { attribute ->
        [(attribute): (suite.@"${attribute}".text() ?: '0').toInteger()]
    }
    if (suiteCounts.values().any { it != 0 }) {
        throw new GradleException("Test report contains unsuccessful cases: ${report} ${suiteCounts}")
    }
    [className: className, name: testName, status: 'passed']
}

tasks.register('verifyFixtureWiring') {
    group = 'verification'
    description = 'Proves the explicit test-fixtures edge is required for Schema contract compilation.'
    inputs.files(fileTree(rootDir) {
        include 'settings.gradle', 'build.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat'
        include 'gradle/wrapper/**', 'domain-api/**', 'schema/**'
        exclude '**/build/**'
    })
    inputs.properties(effectiveSelection)
    outputs.dir(layout.buildDirectory.dir('verification/fixture-wiring'))

    doLast {
        def outputDirectory = layout.buildDirectory.dir('verification/fixture-wiring').get().asFile
        def controlRoot = new File(outputDirectory, 'control')
        def missingFixtureRoot = new File(outputDirectory, 'missing-fixture')
        delete controlRoot, missingFixtureRoot

        [controlRoot, missingFixtureRoot].each { target ->
            copy {
                from rootDir
                into target
                include 'settings.gradle', 'build.gradle', 'gradle.properties'
                include 'domain-api/**', 'schema/**'
                exclude '**/build/**'
            }
        }

        def fixtureDependency = "    testImplementation(testFixtures(project(':domain-api')))"
        def missingFixtureBuild = new File(missingFixtureRoot, 'schema/build.gradle')
        def originalBuild = missingFixtureBuild.text
        if (originalBuild.readLines().count { it == fixtureDependency } != 1) {
            throw new GradleException('Expected exactly one explicit Domain API test-fixtures dependency')
        }
        missingFixtureBuild.text = originalBuild.readLines()
                .findAll { it != fixtureDependency }
                .join(System.lineSeparator()) + System.lineSeparator()
        if (!missingFixtureBuild.text.contains("implementation project(':domain-api')")) {
            throw new GradleException('Negative wiring harness removed the Domain API production dependency')
        }

        def runCompile = { File projectDirectory, File logFile ->
            def output = new ByteArrayOutputStream()
            def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
            def wrapperCommand = windows
                    ? ['cmd', '/c', rootProject.file('gradlew.bat')]
                    : [rootProject.file('gradlew')]
            def propertyArguments = effectiveSelection.collect { name, value -> "-P${name}=${value}".toString() }
            def result = exec {
                workingDir rootDir
                commandLine(wrapperCommand + ['-p', projectDirectory] + propertyArguments + [
                        ':schema:compileTestGroovy', '--no-daemon', '--console=plain', '--warning-mode=none'
                ])
                standardOutput output
                errorOutput output
                ignoreExitValue = true
            }
            logFile.parentFile.mkdirs()
            logFile.text = output.toString('UTF-8')
            [exitValue: result.exitValue, output: logFile.text]
        }

        def controlLog = new File(outputDirectory, 'control.log')
        def missingFixtureLog = new File(outputDirectory, 'missing-fixture.log')
        def control = runCompile(controlRoot, controlLog)
        if (control.exitValue != 0) {
            throw new GradleException("Wired control failed; see ${controlLog}")
        }

        def missingFixture = runCompile(missingFixtureRoot, missingFixtureLog)
        def failedAtExpectedTask = missingFixture.output.contains('Task :schema:compileTestGroovy FAILED')
        def missingExpectedType = missingFixture.output.contains(
                'unable to resolve class org.klum.catwalk.api.contract.EnvironmentContract'
        )
        if (missingFixture.exitValue == 0 || !failedAtExpectedTask || !missingExpectedType) {
            throw new GradleException("Missing-fixture build did not fail at the expected contract seam; see ${missingFixtureLog}")
        }

        def evidence = [
                effectiveSelection: effectiveSelection,
                wiredControl      : [task: ':schema:compileTestGroovy', outcome: 'passed'],
                missingFixture: [
                        removedDependency           : "testFixtures(project(':domain-api'))",
                        productionDependencyRetained: true,
                        task                        : ':schema:compileTestGroovy',
                        outcome                     : 'expected-failure',
                        missingType                 : 'org.klum.catwalk.api.contract.EnvironmentContract'
                ]
        ]
        def evidenceFile = new File(outputDirectory, 'fixture-wiring-evidence.json')
        evidenceFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(evidence)) + System.lineSeparator()
    }
}

tasks.register('verifyLayer3TestPairAlignment') {
    group = 'verification'
    description = 'Verifies that API fixtures and Schema tests resolve the root-selected Groovy/Spock pair.'
    inputs.files(fileTree(rootDir) {
        include 'build.gradle', 'gradle.properties', 'domain-api/build.gradle', 'schema/build.gradle'
    })
    outputs.file(layout.buildDirectory.file('verification/test-pair-alignment.json'))
    outputs.upToDateWhen { false }

    doLast {
        def domainApi = project(':domain-api')
        def schema = project(':schema')
        def resolvedPairs = [
                domainApiFixtureCompile: resolvedPair(domainApi, 'testFixturesCompileClasspath'),
                domainApiFixtureRuntime: resolvedPair(domainApi, 'testFixturesRuntimeClasspath'),
                schemaTestCompile      : resolvedPair(schema, 'testCompileClasspath'),
                schemaTestRuntime      : resolvedPair(schema, 'testRuntimeClasspath')
        ]
        resolvedPairs.each { participant, resolved -> requireSelectedPair(participant, resolved) }

        def output = layout.buildDirectory.file('verification/test-pair-alignment.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                selectedPair : [groovy: layer3TestPair.groovyCoordinate, spock: layer3TestPair.spockCoordinate],
                resolvedPairs: resolvedPairs
        ])) + System.lineSeparator()
    }
}

tasks.register('verifyGroovySpockMismatchDiagnostics') {
    group = 'verification'
    description = 'Exercises the pair-alignment diagnostic with a disposable Schema dependency drift.'
    inputs.files(fileTree(rootDir) {
        include 'settings.gradle', 'build.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat'
        include 'gradle/wrapper/**', 'domain-api/**', 'schema/**'
        exclude '**/build/**'
    })
    inputs.properties(effectiveSelection)
    outputs.file(layout.buildDirectory.file('verification/test-pair-mismatch.json'))
    outputs.upToDateWhen { false }

    doLast {
        def outputDirectory = layout.buildDirectory.dir('verification/test-pair-mismatch').get().asFile
        def mismatchRoot = new File(outputDirectory, 'schema-groovy-spock-drift')
        delete mismatchRoot
        copy {
            from rootDir
            into mismatchRoot
            include 'settings.gradle', 'build.gradle', 'gradle.properties'
            include 'domain-api/**', 'schema/**'
            exclude '**/build/**'
        }

        def compatibleMismatchPairs = [
                [groovyVersion: '3.0.24', spockVersion: '2.3-groovy-3.0'],
                [groovyVersion: '3.0.25', spockVersion: '2.4-groovy-3.0']
        ]
        def mismatchPair = compatibleMismatchPairs.find { candidate ->
            candidate.groovyVersion != layer3TestPair.groovyVersion ||
                    candidate.spockVersion != layer3TestPair.spockVersion
        }
        if (mismatchPair == null) {
            throw new GradleException("No compatible mismatch pair is distinct from ${layer3TestPair}")
        }
        def mismatchGroovy = "org.codehaus.groovy:groovy:${mismatchPair.groovyVersion}"
        def mismatchSpock = "org.spockframework:spock-core:${mismatchPair.spockVersion}"
        def schemaBuild = new File(mismatchRoot, 'schema/build.gradle')
        schemaBuild << """

dependencies {
    // Deliberately isolated from the real build: CT-3 must report this drift.
    testImplementation '${mismatchGroovy}'
    testImplementation '${mismatchSpock}'
}

configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    resolutionStrategy.force(
            '${mismatchGroovy}',
            '${mismatchSpock}'
    )
}
"""

        def output = new ByteArrayOutputStream()
        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        def wrapperCommand = windows
                ? ['cmd', '/c', rootProject.file('gradlew.bat')]
                : [rootProject.file('gradlew')]
        def propertyArguments = effectiveSelection.collect { name, value -> "-P${name}=${value}".toString() }
        def result = exec {
            workingDir rootDir
            commandLine(wrapperCommand + ['-p', mismatchRoot] + propertyArguments + [
                    'verifyLayer3TestPairAlignment', '--no-daemon', '--console=plain', '--warning-mode=none'
            ])
            standardOutput output
            errorOutput output
            ignoreExitValue = true
        }
        def logFile = new File(outputDirectory, 'schema-groovy-spock-drift.log')
        logFile.parentFile.mkdirs()
        logFile.text = output.toString('UTF-8')
        def expectedDiagnostic = 'Layer 3 Groovy/Spock pair mismatch for schemaTestCompile'
        if (result.exitValue == 0 || !logFile.text.contains(expectedDiagnostic)) {
            throw new GradleException("Schema pair drift did not produce the expected CT-3 diagnostic; see ${logFile}")
        }

        def evidence = [
                selectedPair: [groovy: layer3TestPair.groovyCoordinate, spock: layer3TestPair.spockCoordinate],
                injectedSchemaDependencies: [
                        mismatchGroovy,
                        mismatchSpock
                ],
                task      : 'verifyLayer3TestPairAlignment',
                outcome   : 'expected-failure',
                diagnostic: expectedDiagnostic
        ]
        def evidenceFile = layout.buildDirectory.file('verification/test-pair-mismatch.json').get().asFile
        evidenceFile.parentFile.mkdirs()
        evidenceFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(evidence)) + System.lineSeparator()
    }
}

tasks.register('verifyLayer3ContractEvidence') {
    group = 'verification'
    description = 'Verifies API-only fixture packaging, inherited execution, and selected test-pair evidence.'
    dependsOn ':domain-api:jar', ':domain-api:testFixturesJar', ':schema:test', 'verifyFixtureWiring',
            'verifyLayer3TestPairAlignment', 'verifyGroovySpockMismatchDiagnostics'
    outputs.file(layout.buildDirectory.file('verification/layer3-contract-evidence.json'))
    outputs.upToDateWhen { false }

    doLast {
        def domainApi = project(':domain-api')
        def schema = project(':schema')
        def pairAlignmentFile = layout.buildDirectory.file('verification/test-pair-alignment.json').get().asFile
        if (!pairAlignmentFile.isFile()) {
            throw new GradleException("Missing test-pair alignment evidence: ${pairAlignmentFile}")
        }
        def pairAlignment = new JsonSlurper().parse(pairAlignmentFile)

        def productionTestDependencies = ['apiElements', 'runtimeElements'].collectMany { configurationName ->
            domainApi.configurations.named(configurationName).get().allDependencies.collect { dependency ->
                "${dependency.group}:${dependency.name}".toString()
            }
        }.findAll { coordinate ->
            coordinate.startsWith('org.codehaus.groovy:') || coordinate.startsWith('org.spockframework:')
        }
        if (!productionTestDependencies.isEmpty()) {
            throw new GradleException("Test dependencies leaked into the Domain API production variants: ${productionTestDependencies}")
        }

        def contractClass = 'org/klum/catwalk/api/contract/EnvironmentContract.class'
        def mainJar = domainApi.tasks.named('jar').get().archiveFile.get().asFile
        def fixturesJar = domainApi.tasks.named('testFixturesJar').get().archiveFile.get().asFile
        new ZipFile(mainJar).withCloseable { archive ->
            if (archive.getEntry(contractClass) != null) {
                throw new GradleException("Domain API contract leaked into the main artifact: ${contractClass}")
            }
        }
        new ZipFile(fixturesJar).withCloseable { archive ->
            if (archive.getEntry(contractClass) == null) {
                throw new GradleException("Domain API contract is absent from the test-fixtures artifact: ${contractClass}")
            }
        }

        def contractSource = domainApi.file('src/testFixtures/groovy/org/klum/catwalk/api/contract/EnvironmentContract.groovy')
        def forbiddenReferences = [
                'org.klum.catwalk.schema',
                'com.blackbuild.klum.ast',
                '_DSL',
                'Builder',
                'Cluster'
        ].findAll { contractSource.text.contains(it) }
        if (!forbiddenReferences.empty) {
            throw new GradleException("API contract contains forbidden Layer 3 references: ${forbiddenReferences}")
        }

        def contractReport = schema.layout.buildDirectory.file(
                'test-results/test/TEST-org.klum.catwalk.schema.CustomerEnvironmentContractSpec.xml'
        ).get().asFile
        def inheritedFeature = requireSuccessfulTestCase(
                contractReport,
                'org.klum.catwalk.schema.CustomerEnvironmentContractSpec',
                'exposes generic primary application'
        )

        def pairReport = schema.layout.buildDirectory.file(
                'test-results/test/TEST-org.klum.catwalk.schema.GroovySpockAlignmentSpec.xml'
        ).get().asFile
        def alignmentFeature = requireSuccessfulTestCase(
                pairReport,
                'org.klum.catwalk.schema.GroovySpockAlignmentSpec',
                'uses the root-selected Groovy and Spock pair'
        )

        def fixtureWiringFile = layout.buildDirectory.file(
                'verification/fixture-wiring/fixture-wiring-evidence.json'
        ).get().asFile
        if (!fixtureWiringFile.isFile()) {
            throw new GradleException("Missing fixture-wiring evidence: ${fixtureWiringFile}")
        }
        def fixtureWiring = new JsonSlurper().parse(fixtureWiringFile)
        def pairMismatchFile = layout.buildDirectory.file('verification/test-pair-mismatch.json').get().asFile
        if (!pairMismatchFile.isFile()) {
            throw new GradleException("Missing test-pair mismatch evidence: ${pairMismatchFile}")
        }

        def evidence = [
                fixture             : rootProject.name,
                klumAstVersion       : providers.gradleProperty('klumAstVersion').get(),
                selectedPair         : pairAlignment.selectedPair,
                resolvedPairs        : pairAlignment.resolvedPairs,
                fixtureContract      : contractClass,
                absentFromMainJar    : true,
                presentInFixturesJar : true,
                forbiddenReferences : forbiddenReferences,
                productionTestDependencies: productionTestDependencies,
                inheritedTest        : inheritedFeature,
                alignmentTest        : alignmentFeature,
                fixtureWiring        : fixtureWiring,
                pairMismatchDiagnostic: new JsonSlurper().parse(pairMismatchFile),
                optionalModelIncluded: false
        ]
        def output = layout.buildDirectory.file('verification/layer3-contract-evidence.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(evidence)) + System.lineSeparator()
    }
}

tasks.named('check') {
    dependsOn ':domain-api:check', ':schema:check', 'verifyLayer3ContractEvidence'
}
