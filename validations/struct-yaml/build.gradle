import groovy.json.JsonOutput
import groovy.xml.XmlSlurper
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

plugins {
    id 'com.blackbuild.klum-ast-schema' version "${klumAstVersion}"
}

def selectedKlumAstVersion = providers.gradleProperty('klumAstVersion').get()
def retainedBaselineVersion = '4.2.0-rc.4'
def pluginId = 'com.blackbuild.klum-ast-schema'
def rootType = 'org.klum.catwalk.structyaml.ReleaseManifest'
def generatedSchema = layout.buildDirectory.file(
        "generated/klum-json-schema/${rootType}.schema.json"
)

klumSchema {
    groovyVersion = providers.gradleProperty('groovyLine').get()
    jsonSchema {
        rootTypes.add(rootType)
    }
}

configurations {
    releasedKlumAstProduct {
        canBeConsumed = false
        canBeResolved = true
    }
    schemaPluginMarker {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    def expectedMarker = "${pluginId}:${pluginId}.gradle.plugin:${retainedBaselineVersion}".toString()
    def expectedBom = "com.blackbuild.klum.ast:klum-ast-bom:${retainedBaselineVersion}".toString()

    releasedKlumAstProduct platform(expectedBom)
    releasedKlumAstProduct expectedBom
    releasedKlumAstProduct "com.blackbuild.klum.ast:klum-ast:${retainedBaselineVersion}"
    releasedKlumAstProduct "com.blackbuild.klum.ast:klum-ast-runtime:${retainedBaselineVersion}"
    schemaPluginMarker expectedMarker

    implementation "org.yaml:snakeyaml:${providers.gradleProperty('snakeyamlVersion').get()}"
    testImplementation "com.networknt:json-schema-validator:${providers.gradleProperty('jsonSchemaValidatorVersion').get()}"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${providers.gradleProperty('jacksonVersion').get()}"
}

def consumerTest = tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'generateKlumJsonSchema'
    inputs.file(generatedSchema)
    systemProperty 'catwalk.generatedSchema', generatedSchema.get().asFile.absolutePath
}

def containsPath = { files, File directory ->
    def root = directory.canonicalFile
    files.files.any { file ->
        def candidate = file.canonicalFile
        candidate == root || candidate.toPath().startsWith(root.toPath())
    }
}

tasks.register('verifyStructYamlPublicBaseline') {
    group = 'verification'
    description = 'Runs the retained public 4.2 Struct/YAML consumer evidence graph.'
    dependsOn 'clean', 'createKlumDslSourceMirrors', 'generateKlumJsonSchema', 'javadoc', 'check'
    outputs.file(layout.buildDirectory.file('verification/struct-yaml-public-evidence.json'))

    doLast {
        def mirror = layout.buildDirectory.dir('generated/sources/klum-dsl-ide/main').get().asFile
        def sourceSets = project.extensions.getByType(org.gradle.api.plugins.JavaPluginExtension).sourceSets
        def main = sourceSets.main
        def compileGroovy = tasks.named('compileGroovy').get()
        def jar = tasks.named('jar').get()
        def mirrorChecks = [
                'main.groovy.source'      : containsPath(main.groovy.sourceDirectories, mirror),
                'compileGroovy.source'    : containsPath(compileGroovy.source, mirror),
                'compileGroovy.classpath' : containsPath(compileGroovy.classpath, mirror),
                'jar.source'              : containsPath(jar.source, mirror),
                'main.runtimeClasspath'   : containsPath(main.runtimeClasspath, mirror),
                'test.runtimeClasspath'   : containsPath(sourceSets.test.runtimeClasspath, mirror)
        ]
        mirrorChecks.each { input, leaked ->
            if (leaked) throw new GradleException("IDE source mirror leaked into ${input}: ${mirror}")
        }
        if (!generatedSchema.get().asFile.isFile()) {
            throw new GradleException("Missing generated JSON Schema: ${generatedSchema.get().asFile}")
        }

        def coordinates = { configuration ->
            configuration.incoming.resolutionResult.allComponents.findAll { component ->
                component.moduleVersion?.group?.startsWith('com.blackbuild.')
            }.collect { component ->
                if (!(component.id instanceof ModuleComponentIdentifier)) {
                    throw new GradleException("${configuration.name} substituted a published module with ${component.id.displayName}")
                }
                component.moduleVersion.toString()
            }.toSet().sort()
        }
        def expectedMarker = "${pluginId}:${pluginId}.gradle.plugin:${retainedBaselineVersion}".toString()
        def expectedImplementation = "com.blackbuild.klum.ast:klum-ast-gradle-plugin:${retainedBaselineVersion}".toString()
        def expectedBom = "com.blackbuild.klum.ast:klum-ast-bom:${retainedBaselineVersion}".toString()
        def marker = coordinates(configurations.schemaPluginMarker)
        def product = coordinates(configurations.releasedKlumAstProduct)
        def schema = coordinates(configurations.getByName(main.compileClasspathConfigurationName))
        def runtime = coordinates(configurations.getByName(main.runtimeClasspathConfigurationName))
        def testRuntime = coordinates(configurations.getByName(sourceSets.test.runtimeClasspathConfigurationName))

        if (!marker.contains(expectedMarker) || !marker.contains(expectedImplementation)) {
            throw new GradleException("Schema plugin did not resolve through the public 4.2 marker: ${marker}")
        }
        if (!product.contains(expectedBom)) {
            throw new GradleException("KlumAST BOM did not resolve normally: ${expectedBom}")
        }
        def expectedAst = "com.blackbuild.klum.ast:klum-ast:${retainedBaselineVersion}".toString()
        def expectedRuntime = "com.blackbuild.klum.ast:klum-ast-runtime:${retainedBaselineVersion}".toString()
        def expectedTestSupport = "com.blackbuild.klum.ast:klum-ast-test-support:${retainedBaselineVersion}".toString()
        [releasedProduct: product, schemaCompile: schema, mainRuntime: runtime, testRuntime: testRuntime].each { graph, resolved ->
            def drift = resolved.findAll {
                it.startsWith('com.blackbuild.klum.ast:') && !it.endsWith(":${retainedBaselineVersion}")
            }
            if (!drift.empty || !resolved.contains(expectedRuntime)) {
                throw new GradleException("${graph} must resolve KlumAST ${retainedBaselineVersion}: ${resolved}")
            }
        }
        if (!product.contains(expectedAst) || !schema.contains(expectedAst) || !testRuntime.contains(expectedTestSupport)) {
            throw new GradleException('Missing the published KlumAST AST or test support on its consumer graph')
        }

        def testTask = consumerTest.get()
        def testReports = fileTree(testTask.reports.junitXml.outputLocation.get().asFile) {
            include 'TEST-*.xml'
        }.files
        def testResult = [tests: 0, skipped: 0, failures: 0, errors: 0]
        testReports.each { report ->
            def suite = new XmlSlurper().parse(report)
            testResult.each { name, count -> testResult[name] = count + suite.attributes()[name].toInteger() }
        }
        if (testResult.tests == 0 || testResult.skipped || testResult.failures || testResult.errors) {
            throw new GradleException("The consumer tests must all pass: ${testResult}")
        }

        def output = layout.buildDirectory.file('verification/struct-yaml-public-evidence.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                mode                 : 'public-release-candidate',
                fixture              : rootProject.name,
                klumAstVersion       : retainedBaselineVersion,
                command              : ['./gradlew'] + gradle.startParameter.taskNames,
                testResult           : testResult,
                gradle               : gradle.gradleVersion,
                java                 : System.getProperty('java.version'),
                pluginMarker         : marker.findAll { it.startsWith("${pluginId}:") },
                pluginImplementation : (marker + product).findAll { it.contains(':klum-ast-gradle-plugin:') }.toSet().sort(),
                bom                  : product.findAll { it == expectedBom },
                releasedProduct      : product,
                schemaResolved       : schema,
                mainRuntimeResolved  : runtime,
                testRuntimeResolved  : testRuntime,
                generatedJsonSchema  : generatedSchema.get().asFile.toString(),
                mirrorInputLeaks     : mirrorChecks,
                repositories         : [dependencies: ['mavenCentral'], plugins: ['gradlePluginPortal', 'mavenCentral']],
                parserOwnership      : 'caller-owned; duplicate keys rejected before Struct conversion'
        ])) + System.lineSeparator()
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(tasks.named('verifyStructYamlPublicBaseline').get()) &&
            selectedKlumAstVersion != retainedBaselineVersion) {
        throw new GradleException(
                "The Struct/YAML baseline requires public KlumAST ${retainedBaselineVersion}; " +
                        "the current value is ${selectedKlumAstVersion}."
        )
    }
}

gradle.projectsEvaluated {
    tasks.named('createKlumDslSourceMirrors') {
        mustRunAfter tasks.named('clean')
    }
    tasks.named('generateKlumJsonSchema') {
        mustRunAfter tasks.named('createKlumDslSourceMirrors')
    }
    tasks.named('javadoc') {
        mustRunAfter tasks.named('generateKlumJsonSchema')
    }
    tasks.named('check') {
        mustRunAfter tasks.named('javadoc')
    }
}
