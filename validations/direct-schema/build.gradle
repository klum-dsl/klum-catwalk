import groovy.json.JsonOutput

plugins {
    id 'com.blackbuild.klum-ast-schema' version "${klumAstVersion}"
}

klumSchema {
    groovyVersion = '3'
}

def selectedKlumAstVersion = providers.gradleProperty('klumAstVersion').get()
def retainedBaselineVersion = '4.0.1'
def retainedAnnoDocimalVersion = '1.0.1'
def pluginId = 'com.blackbuild.klum-ast-schema'
def expectedMarker = "${pluginId}:${pluginId}.gradle.plugin:${retainedBaselineVersion}".toString()
def expectedBom = "com.blackbuild.klum.ast:klum-ast-bom:${retainedBaselineVersion}".toString()
def expectedModules = [
        'klum-ast-annotations',
        'klum-ast',
        'klum-ast-runtime',
        'klum-ast-jackson',
        'klum-ast-bean-validation',
        'klum-ast-gradle-plugin'
].collect { "com.blackbuild.klum.ast:${it}:${retainedBaselineVersion}".toString() }
def excludedModules = ["com.blackbuild.klum.ast:klum-ast-test-support:${retainedBaselineVersion}".toString()]
def expectedAnnoDocimalProductModules = [
        'anno-docimal-annotations',
        'anno-docimal-ast',
        'anno-docimal-global-ast',
        'anno-docimal-gradle-plugin'
].collect { "com.blackbuild.annodocimal:${it}:${retainedAnnoDocimalVersion}".toString() }
def expectedAnnoDocimalSchemaModules = expectedAnnoDocimalProductModules.findAll {
    !it.contains(':anno-docimal-gradle-plugin:')
}

configurations {
    releasedKlumAstProduct {
        canBeConsumed = false
        canBeResolved = true
    }
    schemaPluginMarker {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    releasedKlumAstProduct platform(expectedBom)
    releasedKlumAstProduct expectedBom
    expectedModules.each { releasedKlumAstProduct it }
    schemaPluginMarker expectedMarker
}

def consumerProject = project
def mirrorDirectory = layout.buildDirectory.dir('generated/sources/klum-dsl-ide/main')
def containsPath = { files, File directory ->
    def root = directory.canonicalFile
    files.files.any { file ->
        def candidate = file.canonicalFile
        candidate == root || candidate.toPath().startsWith(root.toPath())
    }
}

tasks.register('verifyResolvedConsumerEvidence') {
    group = 'verification'
    description = 'Records retained public 4.0.1 resolution and rejects generated-mirror input leaks.'
    dependsOn 'check'
    outputs.file(layout.buildDirectory.file('verification/resolved-consumer-evidence.json'))

    doLast {
        def mirror = mirrorDirectory.get().asFile
        def sourceSets = consumerProject.extensions.getByType(org.gradle.api.plugins.JavaPluginExtension).sourceSets
        def main = sourceSets.main
        def compileGroovy = consumerProject.tasks.named('compileGroovy').get()
        def javadoc = consumerProject.tasks.named('javadoc').get()
        def jar = consumerProject.tasks.named('jar').get()
        def checks = [
                'main.java.source'          : containsPath(main.java.sourceDirectories, mirror),
                'main.groovy.source'        : containsPath(main.groovy.sourceDirectories, mirror),
                'compileGroovy.source'      : containsPath(compileGroovy.source, mirror),
                'compileGroovy.classpath'   : containsPath(compileGroovy.classpath, mirror),
                'javadoc.source'            : containsPath(javadoc.source, mirror),
                'jar.source'                : containsPath(jar.source, mirror),
                'main.runtimeClasspath'     : containsPath(main.runtimeClasspath, mirror),
                'test.runtimeClasspath'     : containsPath(sourceSets.test.runtimeClasspath, mirror)
        ]
        checks.each { input, leaked ->
            if (leaked) throw new GradleException("IDE source mirror leaked into ${input}: ${mirror}")
        }

        def resolvedCoordinates = { configuration ->
            def components = configuration.incoming.resolutionResult.allComponents.collect { component ->
                component.moduleVersion ? "${component.moduleVersion.group}:${component.moduleVersion.name}:${component.moduleVersion.version}".toString() : component.id.displayName
            }
            def dependencies = configuration.incoming.resolutionResult.allDependencies.findAll {
                it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult
            }.collect { dependency ->
                def selected = dependency.selected.moduleVersion
                selected ? "${selected.group}:${selected.name}:${selected.version}".toString() : dependency.selected.id.displayName
            }
            (components + dependencies).findAll { it.startsWith('com.blackbuild.') }.toSet()
        }
        def product = resolvedCoordinates(configurations.releasedKlumAstProduct)
        def marker = resolvedCoordinates(configurations.schemaPluginMarker)
        def requestedProduct = configurations.releasedKlumAstProduct.incoming.resolutionResult.allDependencies
                .collect { it.requested.displayName }.toSet()
        def unresolvedProduct = configurations.releasedKlumAstProduct.incoming.resolutionResult.allDependencies.findAll {
            it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
        }
        def resolvedSchema = main.compileClasspath.incoming.resolutionResult.allComponents.collect { component ->
            component.moduleVersion ? "${component.moduleVersion.group}:${component.moduleVersion.name}:${component.moduleVersion.version}".toString() : component.id.displayName
        }.findAll { it.startsWith('com.blackbuild.') }.toSet()
        def expectedImplementation = "com.blackbuild.klum.ast:klum-ast-gradle-plugin:${retainedBaselineVersion}".toString()
        def resolvedAnnoDocimalProduct = product.findAll { it.startsWith('com.blackbuild.annodocimal:') }.toSet()
        def resolvedAnnoDocimalSchema = resolvedSchema.findAll { it.startsWith('com.blackbuild.annodocimal:') }.toSet()

        expectedModules.each { expected ->
            if (!product.contains(expected)) throw new GradleException("Missing expected KlumAST product module: ${expected}")
        }
        if (!requestedProduct.contains(expectedBom) || !unresolvedProduct.empty)
            throw new GradleException("KlumAST BOM did not resolve normally: ${expectedBom}")
        if (!marker.contains(expectedMarker)) throw new GradleException("Schema plugin marker did not resolve normally: ${expectedMarker}")
        if (!marker.contains(expectedImplementation))
            throw new GradleException("Schema plugin marker did not select its public implementation: ${expectedImplementation}")
        expectedAnnoDocimalProductModules.each { expected ->
            if (!resolvedAnnoDocimalProduct.contains(expected))
                throw new GradleException("Missing expected AnnoDocimal release-line module: ${expected}")
        }
        if (resolvedAnnoDocimalSchema != expectedAnnoDocimalSchemaModules.toSet())
            throw new GradleException("Unexpected AnnoDocimal Schema graph: ${resolvedAnnoDocimalSchema.sort()}")
        excludedModules.each { forbidden ->
            if (product.contains(forbidden) || resolvedSchema.contains(forbidden))
                throw new GradleException("Direct consumer must not require ${forbidden}")
        }
        if (!consumerProject.pluginManager.hasPlugin(pluginId))
            throw new GradleException("Schema plugin was not applied through its public marker: ${pluginId}")
        if (consumerProject.pluginManager.hasPlugin('maven-publish'))
            throw new GradleException('Direct consumer unexpectedly applies the maven-publish plugin')

        def evidence = [
                mode                  : 'public-release',
                fixture               : rootProject.name,
                klumAstVersion        : retainedBaselineVersion,
                gradle                : gradle.gradleVersion,
                java                  : System.getProperty('java.version'),
                pluginMarker          : marker.findAll { it.startsWith("${pluginId}:") }.sort(),
                pluginImplementation  : (marker + product).findAll { it.contains(':klum-ast-gradle-plugin:') }.toSet().sort(),
                bom                   : requestedProduct.findAll { it == expectedBom }.sort(),
                releasedProduct       : product.sort(),
                schemaResolved        : resolvedSchema.sort(),
                annodocimal           : [
                        expectedVersion: retainedAnnoDocimalVersion,
                        releasedProduct: resolvedAnnoDocimalProduct.sort(),
                        schemaResolved : resolvedAnnoDocimalSchema.sort()
                ],
                mirrorDirectory       : mirror.toString(),
                mirrorInputLeaks      : checks,
                publicationPluginApplied: false,
                repositories          : [dependencies: ['mavenCentral'], plugins: ['gradlePluginPortal', 'mavenCentral']],
                excludedHistoricalModules: excludedModules
        ]
        def output = layout.buildDirectory.file('verification/resolved-consumer-evidence.json').get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(evidence)) + System.lineSeparator()
    }
}

tasks.register('verifyDirectPublicBaseline') {
    group = 'verification'
    description = 'Runs SC-1’s retained clean-to-evidence public 4.0.1 task graph.'
    dependsOn 'clean', 'createKlumDslSourceMirrors', 'javadoc', 'check', 'verifyResolvedConsumerEvidence'
}

gradle.taskGraph.whenReady { taskGraph ->
    def baselineTaskRequested = ['verifyResolvedConsumerEvidence', 'verifyDirectPublicBaseline'].any {
        taskGraph.hasTask(tasks.named(it).get())
    }
    if (baselineTaskRequested && selectedKlumAstVersion != retainedBaselineVersion) {
        throw new GradleException(
                "SC-1 evidence is retained for KlumAST ${retainedBaselineVersion}; " +
                        "use test/check for ${selectedKlumAstVersion} smoke coverage until SC-2 provides a product manifest."
        )
    }
}

gradle.projectsEvaluated {
    tasks.named('createKlumDslSourceMirrors') {
        mustRunAfter tasks.named('clean')
    }
    tasks.named('javadoc') {
        mustRunAfter tasks.named('createKlumDslSourceMirrors')
    }
    tasks.named('check') {
        mustRunAfter tasks.named('javadoc')
    }
    tasks.named('verifyResolvedConsumerEvidence') {
        mustRunAfter tasks.named('check')
    }
}
